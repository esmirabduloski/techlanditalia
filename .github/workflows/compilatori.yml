# Test dei compilatori sui task veri dei corsi (e2e/compilatori/task-reali.json,
# scaricato da Admin → Backup) e dei programmi Pygame Zero eseguiti davvero.
# Gira quando cambia qualcosa che tocca i compilatori e ogni lunedì: se jsDelivr
# ritira la versione di Pyodide o Skulpt usata dal sito, lo scopriamo prima
# degli alunni.
name: Test compilatori

on:
  push:
    branches: [main]
    paths:
      - "src/components/lesson/**"
      - "src/lib/**"
      - "src/hooks/**"
      - "src/pages/area-riservata/**"
      - "public/pyodide-test-worker.js"
      - "public/pyodide/**"
      - "public/pgzero-libreria/**"
      - "index.html"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".github/workflows/compilatori.yml"
  pull_request:
    paths:
      - "src/components/lesson/**"
      - "src/lib/**"
      - "src/hooks/**"
      - "src/pages/area-riservata/**"
      - "public/pyodide-test-worker.js"
      - "public/pyodide/**"
      - "public/pgzero-libreria/**"
      - "index.html"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".github/workflows/compilatori.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  task-reali:
    name: Compilatori sui task veri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Casi scritti a mano e task veri (Playwright)
        run: npx playwright test e2e/compilatori
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-compilatori
          path: playwright-report/
          retention-days: 7

  pgzero:
    name: Pygame Zero eseguito davvero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: e2e/compilatori/pgzero/requirements.txt
      - run: pip install -r e2e/compilatori/pgzero/requirements.txt
      - name: Programmi Pygame Zero senza schermo
        run: python e2e/compilatori/pgzero/esegui.py
