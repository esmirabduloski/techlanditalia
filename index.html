<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security headers (defense in depth — primary headers should be set at the edge/CDN) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(self), usb=(), accelerometer=(), gyroscope=()" />
    <!-- X-Frame-Options NON va messo in un <meta>: il browser lo ignora e logga un errore
         (Lighthouse "errori in console"). L'header vero arriva già dall'hosting. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Meta per-pagina (title, description, robots, canonical, og:*, twitter:*) emessi
         nell'HTML statico da vite-react-ssg via SEOHead: nessun fallback statico qui per
         evitare tag duplicati/conflittuali (audit SEO-002). Le route non prerenderate
         (aree private) sono noindex/dietro auth e impostano il title a runtime. -->
    <meta name="google-site-verification" content="OI5SJeV2TBEb8DNnNYMe6u1FwzvPLkA9-Gc1Y41TFbU" />
    <meta name="twitter:site" content="@techlanditalia" />

    <!-- Iubenda Cookie Solution: banner consenso + auto-blocco script (Clarity, GA, ecc.).
         Va caricata PRIMA degli altri script di tracciamento. -->
    <script type="text/javascript">
      var _iub = _iub || [];
      _iub.csConfiguration = {"siteId":4686056,"cookiePolicyId":92368401,"lang":"it","storage":{"useSiteId":true}};
    </script>
    <script type="text/javascript" src="https://cs.iubenda.com/autoblocking/4686056.js"></script>
    <script type="text/javascript" src="//cdn.iubenda.com/cs/gpp/stub.js"></script>
    <script type="text/javascript" src="//cdn.iubenda.com/cs/iubenda_cs.js" charset="UTF-8" async></script>

    <!-- Google Tag Manager. Caricato DOPO iubenda: così il blocco dei tracker e
         Google Consent Mode sono già registrati quando il container viene scaricato.
         Il container di per sé non imposta cookie: sono i tag al suo interno a farlo,
         e vanno legati al consenso (Consent Mode). -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TWTS4C7Z');</script>
    <!-- End Google Tag Manager -->


    <!-- Microsoft Clarity: SOLO pagine pubbliche. Le aree riservate (studenti minorenni,
         genitori, insegnanti, admin) e il login non vengono mai registrate — stessa
         lista di src/lib/clarity.ts; ClarityGuard.tsx copre la navigazione SPA.
         Consenso negato di default (consentv2): nessun cookie, visite non collegate. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        if (/^\/(admin|area-riservata|insegnante|auth|\.lovable)(\/|$)/.test(l.location.pathname)) return;
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        c[a]("consentv2",{ad_Storage:"denied",analytics_Storage:"denied"});
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "wk0bgige7s");
    </script>

    <!-- Font loaded locally via @fontsource -->


    <!-- Canonical: set per-route via react-helmet (SEOHead). No static fallback to avoid every page declaring `/` as canonical. -->

    <!-- LLM/AI discovery: Markdown mirrors -->
    <link rel="alternate" type="text/markdown" title="TECHLAND (Markdown for LLMs)" href="/llms.txt" />
